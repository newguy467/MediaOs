# mediaos GPU profiles — HandBrake/Tdarr-style hardware encode
#
# Usage (pick one profile):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile nvidia up -d
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile intel up -d
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile amd up -d
#
# Requires: host drivers + ffmpeg with NVENC / QSV / AMF (image ships ffmpeg; GPU encode
# needs matching host libs — see docs/GPU.md).

services:
  mediaos:
    # Shared converter env for all GPU profiles
    environment:
      CONVERTER_HWACCEL_DEFAULT: ${CONVERTER_HWACCEL_DEFAULT:-none}

  # ── NVIDIA NVENC ──────────────────────────────────────────────────────────
  mediaos-nvidia:
    profiles: ["nvidia"]
    extends:
      service: mediaos
      file: docker-compose.yml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      CONVERTER_HWACCEL_DEFAULT: cuda
    # Docker Compose v2 without swarm still needs device requests via:
    gpus: all

  # ── Intel Quick Sync (QSV) ────────────────────────────────────────────────
  mediaos-intel:
    profiles: ["intel"]
    extends:
      service: mediaos
      file: docker-compose.yml
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "109"  # render group — adjust to host `getent group render`
      - "44"   # video group — adjust if needed
    environment:
      CONVERTER_HWACCEL_DEFAULT: qsv
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME:-iHD}

  # ── AMD AMF / VAAPI ───────────────────────────────────────────────────────
  mediaos-amd:
    profiles: ["amd"]
    extends:
      service: mediaos
      file: docker-compose.yml
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "109"
      - "44"
    environment:
      CONVERTER_HWACCEL_DEFAULT: amf
      LIBVA_DRIVER_NAME: ${LIBVA_DRIVER_NAME:-radeonsi}
