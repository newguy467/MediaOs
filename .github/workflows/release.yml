name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: ver
        run: |
          TAG=${GITHUB_REF_NAME#v}
          FILE=$(tr -d '[:space:]' < VERSION || echo "")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "file=$FILE" >> $GITHUB_OUTPUT
          if [ -n "$FILE" ] && [ "$TAG" != "$FILE" ]; then
            echo "::warning::Tag v$TAG does not match VERSION file ($FILE)"
          fi

      - name: Generate release notes from CHANGELOG.md
        run: python3 scripts/extract_release_notes.py "${{ steps.ver.outputs.tag }}"

      - name: Build release zip
        run: |
          NAME="MediaOs-v${{ steps.ver.outputs.tag }}"
          mkdir -p release
          zip -r "release/${NAME}.zip" . \
            -x ".git/*" -x "node_modules/*" -x "release/*" -x "*.pyc" -x "*__pycache__*"
          cd release
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          cp "${NAME}.zip.sha256" SHA256SUMS.txt
          zip -j "${NAME}.zip" SHA256SUMS.txt
          if [ -f ../RELEASE_NOTES.md ]; then
            zip -j "${NAME}.zip" ../RELEASE_NOTES.md || true
          fi
          if [ -f ../GITHUB_RELEASE_v${{ steps.ver.outputs.tag }}.md ]; then
            zip -j "${NAME}.zip" "../GITHUB_RELEASE_v${{ steps.ver.outputs.tag }}.md" || true
          fi
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MediaOs ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
