name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    name: Static checks (version, UI, lazy exports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python3 scripts/check_version.py
      - run: python3 scripts/check_ui_static.py
      - run: node scripts/check_lazy_exports.mjs

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run test suite
        env:
          DATABASE_URL: "sqlite:////tmp/mediaos-ci.db"
          AUTH_REQUIRE: "false"
        run: python3 -m pytest -q

  alembic-roundtrip:
    name: Alembic upgrade/downgrade/upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Real migration round-trip against SQLite
        env:
          DATABASE_URL: "sqlite:////tmp/mediaos-alembic-ci.db"
        run: |
          rm -f /tmp/mediaos-alembic-ci.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          echo "Alembic round-trip OK"

  vite-build:
    name: vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - name: Verify build output
        run: |
          test -f app/static/index.html
          test -d app/static/assets
          echo "Vite build OK: $(ls app/static/assets | wc -l) assets"
