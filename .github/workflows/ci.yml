name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Offline unit smoke
        run: python scripts/smoke_unit.py
      - name: Pytest
        run: pytest tests/ -q --tb=short
        env:
          # Avoid requiring a real DB for pure unit modules
          DATABASE_URL: sqlite+pysqlite:////tmp/mediaos-ci.db

  settings-smoke:
    name: Settings smoke (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mediaos
          POSTGRES_PASSWORD: mediaos
          POSTGRES_DB: mediaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediaos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run app_settings smoke
        env:
          DATABASE_URL: postgresql://mediaos:mediaos@localhost:5432/mediaos
        run: python scripts/test_app_settings.py

  ui:
    name: Vite UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci || npm install
      - run: npm run build
      - run: test -f app/static/index.html && test -d app/static/assets

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [unit, ui]
    if: github.event_name != 'pull_request' || true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mediaos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
