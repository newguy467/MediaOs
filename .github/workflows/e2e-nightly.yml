name: E2E (nightly)

on:
  schedule:
    # Nightly, 03:17 UTC (off the hour to avoid the top-of-hour GH Actions
    # traffic spike).
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  e2e:
    name: Boot instance + Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build UI
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Install Playwright + Chromium
        run: npm run test:e2e:install

      - name: Boot MediaOS
        env:
          DATABASE_URL: "sqlite:////tmp/mediaos-e2e.db"
          AUTH_REQUIRE: "false"
        run: |
          rm -f /tmp/mediaos-e2e.db
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8787 > /tmp/mediaos-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then
              echo "MediaOS is up"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "MediaOS did not come up in time"
              cat /tmp/mediaos-e2e.log
              exit 1
            fi
            sleep 1
          done

      - name: Run Playwright smoke specs
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:8787"
        run: npm run test:e2e

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mediaos-e2e.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
