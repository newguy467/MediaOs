name: UI

on:
  push:
    branches: [main, master]
    paths:
      - "ui/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "ui/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
  workflow_dispatch:

jobs:
  build:
    name: Build UI (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f app/static/index.html
          test -d app/static/assets
          echo "UI build OK: $(ls app/static/assets | wc -l) assets"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaos-ui-dist
          path: app/static
          retention-days: 7
