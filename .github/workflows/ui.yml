name: UI build

on:
  push:
    paths: ["ui/**", "package.json", "vite.config.js", "app/static/app.js", "app/static/styles.css"]
  pull_request:
    paths: ["ui/**", "package.json", "vite.config.js", "app/static/app.js", "app/static/styles.css"]

jobs:
  vite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci || npm install
      - run: npm run build
      - run: test -f app/static/index.html && test -d app/static/assets
