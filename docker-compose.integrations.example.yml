# Companion services for mediaos (not required for core)
# Prefer pinned tags in production. cross-seed / unpackerr upstream tags move
# frequently; override via image digests when locking a deployment.
services:
  cross-seed:
    image: crossseed/cross-seed:6
    volumes:
      - ./cross-seed:/config
      - ${DOWNLOADS_PATH:-./data/downloads}:/downloads:ro
    ports:
      - "2468:2468"
    restart: unless-stopped

  # unpackerr alternative if you prefer external unpacker
  unpackerr:
    image: golift/unpackerr:v0.14.5
    volumes:
      - ${DOWNLOADS_PATH:-./data/downloads}:/downloads
    environment:
      - UN_QBITTORRENT_0_URL=http://qbittorrent:8080
      - UN_QBITTORRENT_0_USER=admin
      - UN_QBITTORRENT_0_PASS=${QBIT_PASSWORD:-changeme}
    restart: unless-stopped

  # Cloudflare bypass for subtitle scrapers (and for Prowlarr if shared)
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    ports:
      - "8191:8191"
    restart: unless-stopped
